name: BarcodeDeck
options:
  bundleIdPrefix: dev.barcodedeck
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEVELOPMENT_LANGUAGE: en
    CODE_SIGN_STYLE: Automatic
# NOTE: the generated BarcodeDeck.xcodeproj is git-ignored on purpose. The
# development team is personal: set it locally in Xcode (Signing &
# Capabilities) or pass DEVELOPMENT_TEAM=<team> on the command line for
# device builds. See HOW_TO_PUBLISH.md.

targets:
  BarcodeDeck:
    type: application
    platform: iOS
    sources:
      - path: BarcodeDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.barcodedeck.app
        CODE_SIGN_STYLE: Automatic
    info:
      path: BarcodeDeck/Info.plist
      properties:
        CFBundleDisplayName: Barcode Deck
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # Camera is used for VisionKit barcode scanning.
        NSCameraUsageDescription: "Barcode Deck uses the camera to scan the barcodes on your cards."
        # The app performs no networking and uses no encryption beyond the OS.
        ITSAppUsesNonExemptEncryption: false
        # Orientation is app-controlled (presentation mode forces landscape),
        # so the app requires full screen — this also satisfies the
        # "all orientations must be supported unless full screen" rule.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  BarcodeDeckUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: BarcodeDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.barcodedeck.app.uitests
        TEST_TARGET_NAME: BarcodeDeck
        GENERATE_INFOPLIST_FILE: YES

  BarcodeDeckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BarcodeDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.barcodedeck.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BarcodeDeck:
    build:
      targets:
        BarcodeDeck: all
        BarcodeDeckUITests: [test]
        BarcodeDeckTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BarcodeDeckTests
        - BarcodeDeckUITests
